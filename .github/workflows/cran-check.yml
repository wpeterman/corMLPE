name: CRAN Check

on:
  workflow_dispatch:
    inputs:
      r_version:
        description: "R version (release/devel/oldrel-1)"
        required: false
        default: "release"
      run_revdep_like:
        description: "Run broader check settings"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  cran-check:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[cran-check]')) ||
      (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'cran-check'))
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }
          - { os: ubuntu-latest, r: devel }

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ github.event.inputs.r_version || matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::covr
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: >-
            --as-cran
            --no-manual
            ${{ github.event.inputs.run_revdep_like == 'true' && '--run-donttest' || '' }}
          error-on: '"warning"'
          build_args: 'c("--no-manual", "--keep-empty-dirs")'

      - name: Test coverage summary
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(type = "tests")
          print(cov)
          cat(sprintf("TOTAL_COVERAGE=%.2f\n", covr::percent_coverage(cov)))

